user nginx nginx;
worker_processes auto;

pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 75 20;



    map $http_upgrade $connection_upgrade {
        default   upgrade;
        ''        keep-alive;
    }

    upstream gateway {
        server gateway:5001;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://gateway;
        }
    }

